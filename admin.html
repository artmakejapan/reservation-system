<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>管理者ページ</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="login-box" id="loginArea">

    <h1>管理者ページ</h1>

    <input
        type="password"
        id="adminPassword"
        placeholder="パスワード">

    <br><br>

    <button id="loginButton">
        ログイン
    </button>

</div>


<div id="adminArea" style="display:none;">

    <div class="search-area">

        <input
            type="text"
            id="searchName"
            placeholder="🔍 お名前で検索">

        <input
            type="date"
            id="searchDate">

    </div>

    <!-- ==================================
     新規予約
================================== -->

<div class="new-reservation-section">

    <button id="openNewReservationButton" type="button">
        ＋ 新規予約
    </button>

</div>


<div id="newReservationArea" style="display:none;">

    <h2>新規予約</h2>

    <!-- ================================
         お客様
    ================================= -->

    <label>お客様検索</label>

<input
    type="text"
    id="newCustomerSearch"
    list="newCustomerCandidates"
    placeholder="名前で検索して選択">

<datalist id="newCustomerCandidates"></datalist>

<div class="customer-help">
    既存のお客様を選ぶと、LINE連携情報と初診項目を自動で引き継ぎます
</div>



    <!-- ================================
         予約基本情報
    ================================= -->

    <label>予約日</label>

    <input
        type="date"
        id="newDate">


    <label>開始時間</label>

    <select id="newTime">

        <option value="">
            選択してください
        </option>

    </select>


    <label>初診・再診</label>

    <select id="newVisit">

        <option value="初診">
            初診
        </option>

        <option value="再診">
            再診
        </option>

    </select>


    <label>メニュー①</label>

    <select id="newMenu1">

        <option value="">
            選択してください
        </option>

    </select>


    <label>メニュー②</label>

    <select id="newMenu2">

        <option value="">
            なし
        </option>

    </select>


    <!-- ================================
         お客様情報
    ================================= -->

    <label>お名前</label>

    <input
        type="text"
        id="newName">


    <label>性別</label>

    <select id="newGender">

        <option value="">
            選択してください
        </option>

        <option value="女性">
            女性
        </option>

        <option value="男性">
            男性
        </option>

        <option value="その他">
            その他
        </option>

    </select>


    <label>年齢</label>

    <input
        type="number"
        id="newAge"
        min="0"
        max="120">


    <label>紹介者</label>

    <input
        type="text"
        id="newReferrer">


    <label>電話番号</label>

    <input
        type="tel"
        id="newTel"
        inputmode="tel">


    <!-- ================================
         施術歴
    ================================= -->

    <label>施術歴</label>

    <select id="newHistorySelector">

        <option value="">
            施術歴を選択してください
        </option>

        <option value="眉">
            眉
        </option>

        <option value="アイライン">
            アイライン
        </option>

        <option value="リップ">
            リップ
        </option>

        <option value="ヘアライン">
            ヘアライン
        </option>

        <option value="その他">
            その他
        </option>

    </select>


    <div id="newHistorySelected"></div>


    <label>既往歴・服薬中のお薬</label>

    <textarea
        id="newMedicalHistory"
        rows="4"></textarea>


    <label>妊娠・授乳中</label>

    <select id="newPregnancy">

        <option value="">
            選択してください
        </option>

        <option value="はい">
            はい
        </option>

        <option value="いいえ">
            いいえ
        </option>

    </select>


    <!-- ================================
         ボタン
    ================================= -->

    <div class="new-reservation-button-row">

        <button
            id="createNewReservationButton"
            type="button">

            予約を登録

        </button>


        <button
            id="closeNewReservationButton"
            type="button">

            閉じる

        </button>

    </div>

</div>


    <!-- ==================================
         予約変更エリア
    ================================== -->

    <div id="editArea" style="display:none;">

        <h2>予約変更</h2>


        <!-- 基本情報 -->

        <label>お名前</label>
        <input
            type="text"
            id="editName">


        <label>予約日</label>
        <input
            type="date"
            id="editDate">


        <label>開始時間</label>
        <select id="editTime"></select>


        <!-- ==================================
             詳細項目
        ================================== -->

        <div id="editDetails">

            <label>初診・再診</label>

            <select id="editVisit">

                <option value="初診">初診</option>
                <option value="再診">再診</option>

            </select>


            <label>メニュー①</label>

            <select id="editMenu1">

                <option value="">
                    選択してください
                </option>

            </select>


            <label>メニュー②</label>

            <select id="editMenu2">

                <option value="">
                    選択してください
                </option>

            </select>


            <label>電話番号</label>

            <input
                type="tel"
                id="editTel"
                inputmode="tel">


            <label>性別</label>

            <select id="editGender">

                <option value="">選択してください</option>
                <option value="女性">女性</option>
                <option value="男性">男性</option>
                <option value="その他">その他</option>

            </select>


            <label>年齢</label>

            <input
                type="number"
                id="editAge"
                min="0"
                max="120">


            <label>紹介者</label>

<input 
    type="text" 
    id="editReferrer">


<!-- ================================
     施術歴
================================ -->

<label>施術歴</label>

<select id="editHistorySelector">

    <option value="">施術歴を選択してください</option>
    <option value="眉">眉</option>
    <option value="アイライン">アイライン</option>
    <option value="リップ">リップ</option>
    <option value="ヘアライン">ヘアライン</option>
    <option value="その他">その他</option>

</select>


<div id="editHistorySelected"></div>


            <label>既往歴・服薬中のお薬</label>

            <textarea
                id="editMedicalHistory"
                rows="4"></textarea>


            <label>妊娠・授乳中</label>

            <select id="editPregnancy">

                <option value="">選択してください</option>
                <option value="はい">はい</option>
                <option value="いいえ">いいえ</option>

            </select>

        </div>


        <div class="edit-button-row">

            <button id="saveEditButton">
                保存
            </button>

            <button id="closeEditButton">
                閉じる
            </button>

        </div>

    </div>


    <div id="reservationList"></div>

</div>


<script src="admin.js"></script>

</body>

</html>
