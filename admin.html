<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>管理者ページ</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="login-box" id="loginArea">

<h1>管理者ページ</h1>

<input
type="password"
id="adminPassword"
placeholder="パスワード">

<br><br>

<button id="loginButton">
ログイン
</button>

</div>

<div id="adminArea" style="display:none;">

<div class="search-area">

<input
type="text"
id="searchName"
placeholder="🔍 お名前で検索">

<input
type="date"
id="searchDate">

<label style="display:flex;align-items:center;gap:8px;margin-top:10px;">
    <input type="checkbox" id="showPast">
    過去の予約を表示
</label>

</div>

<div id="editArea" style="display:none; margin-top:30px;">

<h2>予約変更</h2>

<input type="text" id="editName" placeholder="お名前">

<input type="date" id="editDate">

<select id="editTime">

    <option value="09:30">09:30</option>

    <option value="11:45">11:45</option>

    <option value="14:00">14:00</option>

    <option value="16:15">16:15</option>

</select>

<label>初診・再診</label>

<select id="editVisit">

    <option value="初診">初診</option>

    <option value="再診">再診</option>

</select>

<label>メニュー①</label>

<select id="editMenu1">
    <option value="">選択してください</option>
</select>


<label>メニュー②</label>

<select id="editMenu2">
    <option value="">選択してください</option>
</select>

<label>電話番号</label>
<input type="text" id="editTel">

<br><br>

<button id="saveEditButton">
保存
</button>

<button id="closeEditButton">
閉じる
</button>

</div>

<div id="reservationList"></div>

</div>

<script src="admin.js"></script>

</body>

</html>
