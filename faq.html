<style>
/* =========================================================
   ARTMAKE Manami / よくある質問
   重要事項ページと文字設定を統一
   ========================================================= */

:root{
  --gold:#C99732;
  --gold-dark:#A87923;
  --red:#B85C5C;
  --text:#202020;
  --line:#F1F2F4;
  --bg:#fff;
  --bg-open:#fff;
}

/* ベース */
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:15px;
  font-weight:400;
  line-height:2.15;
  letter-spacing:.045em;
  -webkit-font-smoothing:antialiased;
}

/* 上下のゴールドの帯 */
.band{
  height:44px;
  background:var(--gold);
}

/* サロン名 */
.brand{
  margin:0 0 20px;
  text-align:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:12px;
  font-weight:400;
  letter-spacing:.16em;
  padding-left:.16em;
  color:var(--text);
}

.brand-bottom{
  margin:40px 0 0;
}

/* 全体の幅・見出し */
.faq{
  max-width:720px;
  margin:0 auto;
  padding:56px 20px 72px;
}

.faq-title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin:0 0 48px;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:clamp(22px,5vw,29px);
  font-weight:400;
  letter-spacing:.09em;
  line-height:1.7;
  color:var(--text);
}

.faq-title::before,
.faq-title::after{
  content:"";
  width:clamp(28px,8vw,56px);
  height:1px;
  background:var(--gold);
  flex:none;
}

/* 質問と答え */
.faq-list{
  border-top:1px solid var(--line);
}

details{
  border-bottom:1px solid var(--line);
}

details[open]{
  background:var(--bg-open);
}

summary{
  list-style:none;
  cursor:pointer;
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:22px 8px;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:16px;
  font-weight:600;
  line-height:1.8;
  letter-spacing:.045em;
  color:var(--text);
}

summary::-webkit-details-marker{
  display:none;
}

summary span{
  text-decoration:underline;
  text-underline-offset:5px;
  text-decoration-thickness:1px;
}

summary:hover,
details[open] summary{
  color:var(--gold-dark);
}

summary:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:-2px;
}

/* 質問の左の三角 */
summary::before{
  content:"";
  flex:none;
  margin-top:.72em;
  border-style:solid;
  border-width:5px 0 5px 8px;
  border-color:transparent transparent transparent currentColor;
  transition:transform .25s;
}

details[open] summary::before{
  transform:rotate(-90deg);
}

/* 回答 */
.answer{
  margin:0;
  padding:0 8px 24px 30px;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:15px;
  font-weight:400;
  line-height:2.12;
  letter-spacing:.045em;
  color:var(--text);
  overflow-wrap:anywhere;
}

/* キャンペーンの赤字 */
.campaign{
  display:block;
  margin-top:10px;
  color:var(--red);
  font-weight:600;
}

/* 最後の一文 */
.faq-ending{
  margin:56px 0 0;
  text-align:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:14px;
  font-weight:400;
  line-height:2.3;
  letter-spacing:.045em;
  color:var(--red);
  white-space:normal;
}

/* スマートフォン */
@media(max-width:600px){
  body{
    font-size:16px;
    line-height:2.05;
  }

  .band{
    height:32px;
  }

  .faq{
    padding:42px 18px 54px;
  }

  .brand{
    font-size:11px;
    line-height:1.5;
  }

  .faq-title{
    font-size:clamp(21px,6vw,27px);
    line-height:1.6;
    gap:12px;
    margin-bottom:35px;
  }

  .faq-title::before,
  .faq-title::after{
    width:clamp(20px,7vw,36px);
  }

  summary{
    padding:19px 5px;
    gap:10px;
    font-size:16px;
    line-height:1.8;
  }

  .answer{
    padding:0 5px 22px 25px;
    font-size:16px;
    line-height:2.05;
  }

  .faq-ending{
    margin-top:42px;
    font-size:13px;
    line-height:2.1;
  }

  .brand-bottom{
    margin-top:32px;
  }
}

/* 動きを減らす設定 */
@media(prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  summary::before{
    transition:none;
  }
}
</style>
