<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ART MAKE MANAMI | 予約一覧</title>

    <link rel="stylesheet" href="mypage.css">

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="top-bar">
    <div class="top-bar-inner">
        <button class="menu-button" id="menuButton" type="button" aria-label="メニューを開く">☰</button>
        <h1>アートメイク | マイページ</h1>
    </div>
</header>

<div class="side-overlay" id="sideOverlay"></div>

<nav class="side-menu" id="sideMenu">

    <div class="side-menu-welcome" id="sideMenuWelcome">
        ようこそ ゲスト様
    </div>

    <div class="side-menu-brand">
        アートメイクまなみ
    </div>

    <div class="side-menu-list">

        <button type="button" data-menu-target="home">
            <span class="side-menu-icon">⌂</span>
            <span class="side-menu-text">ホーム</span>
        </button>

        <button type="button" data-menu-target="reservation">
            <span class="side-menu-icon">▣</span>
            <span class="side-menu-text">ご予約・空き状況</span>
        </button>

        <button type="button" data-menu-target="mypage">
            <span class="side-menu-icon">♙</span>
            <span class="side-menu-text">マイページ</span>
        </button>

        <button type="button" data-menu-target="access">
            <span class="side-menu-icon">⌖</span>
            <span class="side-menu-text">アクセス</span>
        </button>

    </div>

</nav>

<main class="container">

    <p id="userName"></p>

    <section class="card">

    <h2>📅 次回の予約</h2>

    <div id="reservationArea">
        読み込み中...
    </div>

</section>


<section class="card">

    <h2>📝 施術歴</h2>

    <div id="historyArea">
        読み込み中...
    </div>

</section>


<section class="card clinic-card" id="access">

    <h2>📍 ACCESS</h2>

    <p class="clinic-name">
        ゆみこ皮フ科クリニック
    </p>

    <img
    src="images/clinic-map.png"
    alt="ゆみこ皮フ科クリニックへのアクセスマップ"
    class="clinic-map"
>

    <a
        href="https://maps.app.goo.gl/LXtC4BYEALuutCNBA"
        target="_blank"
        rel="noopener noreferrer"
        class="google-map-link"
    >
        Googleマップで開く
    </a>

</section>

</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="mypage.js"></script>

</body>
</html>
